name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tools:
    name: tools (python, stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: WZ manifest smoke test
        run: python3 tools/wz1.py Data.wz

  server:
    name: server (node 22, zero deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        working-directory: server
        run: node --test "**/*.test.ts"
      - name: CLI usage
        run: node server/src/cli.ts help
