<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KMS 1.11 — browser view</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <header id="bar">
      <strong>KMS 1.11</strong>
      <span id="where">未連線</span>
      <button id="inv-toggle" type="button">背包</button>
      <button id="log-toggle" type="button">日誌</button>
    </header>

    <section id="worlds" class="panel hidden">
      <h2>選世界</h2>
      <div id="world-list" class="choices"></div>
    </section>

    <section id="characters" class="panel hidden">
      <h2>選角色</h2>
      <div id="character-list" class="choices"></div>
      <div id="new-character">
        <input id="new-name" placeholder="新角色名稱" maxlength="12" spellcheck="false" />
        <button id="create" type="button">建立角色</button>
      </div>
      <p id="character-status" class="status"></p>
    </section>

    <aside id="dialogue" class="hidden">
      <p id="dialogue-text"></p>
      <div class="dialogue-buttons">
        <button id="dialogue-ok" type="button">確定</button>
        <button id="dialogue-close" type="button">關閉</button>
      </div>
    </aside>

    <aside id="log" class="hidden">
      <h3>事件</h3>
      <ol id="log-lines"></ol>
    </aside>

    <!--
      The game's own UI lives on the canvas; only the chat input has to be a real <input>. This layer
      is placed and scaled exactly like `#view`, so its children can use the 2003 client's 800x600
      coordinates - the chat field sits where `UI/StatusBar.img/base/1` draws its input box.
    -->
    <div id="game-ui">
      <div id="title-ui">
        <nav id="title-menu" aria-label="主選單">
          <button id="title-new" class="sprite-hit" type="button" aria-label="新帳號">새로하기</button>
          <button id="title-continue" class="sprite-hit" type="button" aria-label="登入遊戲">이어하기</button>
          <button id="title-homepage" class="sprite-hit" type="button" aria-label="官方網站">홈페이지</button>
          <button id="title-quit" class="sprite-hit" type="button" aria-label="結束遊戲">끝내기</button>
        </nav>
        <section id="connect" class="hidden" role="dialog" aria-modal="true" aria-label="登入">
          <input id="user" aria-label="帳號" autocomplete="username" maxlength="64" spellcheck="false" />
          <input id="pass" aria-label="密碼" type="password" autocomplete="current-password" maxlength="12" />
          <input id="remember-user" class="sprite-hit" aria-label="記住帳號（不儲存密碼）" type="checkbox" />
          <button id="login-lost" class="sprite-hit" type="button" aria-label="忘記帳號或密碼">帳密查詢</button>
          <button id="login" class="sprite-hit" type="button" aria-label="登入">確定</button>
          <button id="login-cancel" class="sprite-hit" type="button" aria-label="取消登入">取消</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </section>
        <p id="title-notice" role="status" aria-live="polite"></p>
      </div>

      <div id="chatbox" class="hidden">
        <ol id="chat-lines"></ol>
        <div id="emotes"></div>
        <input id="say" placeholder="Enter 開始輸入，再按 Enter 送出（/w 名字 訊息、/f 名字）" maxlength="120" spellcheck="false" />
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
